name: Validate and deploy YUP Intelligence v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yup-v2-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Build, test and deploy isolated v2 Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify Cloudflare deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::error::Deployment blocked: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          exit 1

      # Diagnóstico sem expor valores: token ativo, contas visíveis e se CLOUDFLARE_ACCOUNT_ID é uma delas.
      - name: Diagnose Cloudflare token
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "Token (user):    $(api /user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[].message]}')"
          echo "Token (account): $(api /accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[].message]}')"
          echo "Contas visíveis: $(api /accounts | jq -c '[.result[]?.name]')"
          if api /accounts | jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '[.result[]?.id] | index($id)' >/dev/null; then
            echo "CLOUDFLARE_ACCOUNT_ID: corresponde a uma conta visível"
          else
            echo "::warning::CLOUDFLARE_ACCOUNT_ID não corresponde a nenhuma conta visível pelo token (comprimento ${#CLOUDFLARE_ACCOUNT_ID}, esperado 32)"
          fi
          echo "Ler Worker v2: $(api /accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gestao-interna-yup-v2/settings | jq -c '{success, errors: [.errors[].message]}')"

      - name: Deploy isolated v2 Worker and static assets
        run: npx wrangler deploy --config wrangler.jsonc

      # Copia para o Worker os secrets operacionais guardados no GitHub (Settings > Secrets and variables > Actions).
      # Os ausentes só geram aviso; o valor nunca aparece no log.
      - name: Sync operational Worker secrets from GitHub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ERP_TOKEN: ${{ secrets.ERP_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ERP_TOKEN ADMIN_TOKEN; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" --config wrangler.jsonc >/dev/null
              echo "$name: enviado ao Worker"
            else
              echo "::warning::$name não existe nos secrets do GitHub; cadastre no GitHub ou direto no Worker."
            fi
          done

      # Aplica as migrações (idempotentes) quando a URL de conexão do Postgres estiver nos secrets do GitHub.
      # Tolera espaços, quebras de linha e aspas coladas junto; diagnostica o formato sem mostrar a senha.
      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL ausente; migrações não aplicadas."
            exit 0
          fi
          URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n' | sed -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*\$//")
          case "$URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL precisa começar com postgresql:// (é a URI do botão Connect > Session pooler no Supabase). O valor cadastrado tem ${#URL} caracteres e começa com outra coisa."; exit 1 ;;
          esac
          if printf '%s' "$URL" | grep -q 'YOUR-PASSWORD'; then echo "::error::SUPABASE_DB_URL ainda tem [YOUR-PASSWORD]: troque pelo senha do banco."; exit 1; fi
          RESTO=${URL#*://}
          HOST=$(printf '%s' "${RESTO##*@}" | cut -d/ -f1 | cut -d: -f1)
          echo "Conectando em: $HOST"
          case "$HOST" in db.*.supabase.co) echo "::warning::Conexão direta (db.*.supabase.co) só funciona por IPv6, que o GitHub não tem. Se falhar, use a URI do Session pooler (*.pooler.supabase.com).";; esac
          if [ "$(printf '%s' "$RESTO" | tr -cd '@' | wc -c)" -gt 1 ]; then echo "::warning::A URL tem mais de um @: se a senha tiver @, troque por %40."; fi
          for f in supabase/migrations/*.sql; do
            echo "Aplicando $f"
            psql "$URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "Migrações aplicadas."

      - name: Smoke test deployed Worker
        run: |
          sleep 5
          curl -fsS https://gestao-interna-yup-v2.jordano-19-silva.workers.dev/api/health | tee /dev/stderr | grep -q '"supabase": true'
