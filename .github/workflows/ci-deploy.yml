name: Validate and deploy YUP Intelligence v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yup-v2-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Build, test and deploy isolated v2 Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify Cloudflare deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::error::Deployment blocked: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          exit 1

      - name: Deploy isolated v2 Worker and static assets
        run: npx wrangler deploy --config wrangler.jsonc

      # Copia para o Worker os secrets operacionais guardados no GitHub (Settings > Secrets and variables > Actions).
      # Os ausentes só geram aviso; o valor nunca aparece no log.
      - name: Sync operational Worker secrets from GitHub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ERP_TOKEN: ${{ secrets.ERP_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ERP_TOKEN ADMIN_TOKEN; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" --config wrangler.jsonc >/dev/null
              echo "$name: enviado ao Worker"
            else
              echo "::warning::$name não existe nos secrets do GitHub; cadastre no GitHub ou direto no Worker."
            fi
          done

      # Aplica as migrações (idempotentes) quando a URL de conexão do Postgres estiver nos secrets do GitHub.
      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL ausente; migrações não aplicadas."
            exit 0
          fi
          for f in supabase/migrations/*.sql; do
            echo "Aplicando $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Smoke test deployed Worker
        run: |
          sleep 5
          curl -fsS https://gestao-interna-yup-v2.jordano-19-silva.workers.dev/api/health | tee /dev/stderr | grep -q '"supabase": true'
